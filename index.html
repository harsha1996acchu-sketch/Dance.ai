<script>

<script>
// (Three.js removed — now using lightweight 2D canvas rendering)
window.__moduleReady = true;
(function(){ var s=document.getElementById('status'); if(s){ s.textContent=''; } })();

// Show any error on screen instead of failing silently.
window.addEventListener('error', (e) => {
  const s = document.getElementById('status');
  if (s) { s.classList.remove('hidden'); s.style.color = '#ff8888'; s.textContent = 'Error: ' + (e.message || e.error); }
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = (e.reason && e.reason.message || e.reason || '') + '';
  // ignore harmless permission/abort messages so they don't clutter the screen
  if (/permission|abort|notallowed|play\(\)/i.test(msg)) return;
  const s = document.getElementById('status');
  if (s) { s.classList.remove('hidden'); s.style.color = '#ff8888'; s.textContent = 'Load error: ' + msg; }
});

/* ============================================================
   PART 1 — The existing 2D dance engine (reused unchanged).
   ============================================================ */
const CXX = 0.5, SHY = 0.4, HIPY = 0.62;
const GUIDE_JOINTS = ['nose','left_shoulder','right_shoulder','left_elbow','right_elbow',
  'left_wrist','right_wrist','left_hip','right_hip','left_knee','right_knee','left_ankle','right_ankle'];
function basePose(over) {
  const p = {
    nose:           { x: CXX,        y: 0.28 },
    left_shoulder:  { x: CXX-0.075,  y: SHY },
    right_shoulder: { x: CXX+0.075,  y: SHY },
    left_elbow:     { x: CXX-0.15,   y: SHY+0.10 },
    right_elbow:    { x: CXX+0.15,   y: SHY+0.10 },
    left_wrist:     { x: CXX-0.17,   y: SHY+0.20 },
    right_wrist:    { x: CXX+0.17,   y: SHY+0.20 },
    left_hip:       { x: CXX-0.065,  y: HIPY },
    right_hip:      { x: CXX+0.065,  y: HIPY },
    left_knee:      { x: CXX-0.08,   y: HIPY+0.16 },
    right_knee:     { x: CXX+0.08,   y: HIPY+0.16 },
    left_ankle:     { x: CXX-0.085,  y: HIPY+0.32 },
    right_ankle:    { x: CXX+0.085,  y: HIPY+0.32 },
  };
  if (over) for (const k in over) p[k] = over[k];
  return p;
}
const POSES = {
  neutral: () => basePose(),

  armsUp: () => basePose({
    left_elbow:  { x: CXX-0.13, y: SHY-0.08 },
    right_elbow: { x: CXX+0.13, y: SHY-0.08 },
    left_wrist:  { x: CXX-0.12, y: SHY-0.22 },
    right_wrist: { x: CXX+0.12, y: SHY-0.22 },
  }),

  armsOutT: () => basePose({
    left_elbow:  { x: CXX-0.17, y: SHY },
    right_elbow: { x: CXX+0.17, y: SHY },
    left_wrist:  { x: CXX-0.27, y: SHY },
    right_wrist: { x: CXX+0.27, y: SHY },
  }),

  leftUp: () => basePose({
    left_elbow:  { x: CXX-0.13, y: SHY-0.08 },
    left_wrist:  { x: CXX-0.11, y: SHY-0.23 },
    right_elbow: { x: CXX+0.15, y: SHY+0.12 },
    right_wrist: { x: CXX+0.16, y: SHY+0.24 },
  }),

  rightUp: () => basePose({
    right_elbow: { x: CXX+0.13, y: SHY-0.08 },
    right_wrist: { x: CXX+0.11, y: SHY-0.23 },
    left_elbow:  { x: CXX-0.15, y: SHY+0.12 },
    left_wrist:  { x: CXX-0.16, y: SHY+0.24 },
  }),

  handsHips: () => basePose({
    left_elbow:  { x: CXX-0.18, y: SHY+0.08 },
    right_elbow: { x: CXX+0.18, y: SHY+0.08 },
    left_wrist:  { x: CXX-0.09, y: HIPY-0.02 },
    right_wrist: { x: CXX+0.09, y: HIPY-0.02 },
  }),

  prayer: () => basePose({
    left_elbow:  { x: CXX-0.12, y: SHY+0.10 },
    right_elbow: { x: CXX+0.12, y: SHY+0.10 },
    left_wrist:  { x: CXX-0.01, y: SHY+0.08 },
    right_wrist: { x: CXX+0.01, y: SHY+0.08 },
  }),

  leanLeft: () => basePose({
    nose:          { x: CXX-0.06, y: 0.29 },
    left_shoulder: { x: CXX-0.13, y: SHY+0.01 },
    right_shoulder:{ x: CXX+0.05, y: SHY-0.01 },
    left_elbow:    { x: CXX-0.20, y: SHY+0.02 },
    left_wrist:    { x: CXX-0.28, y: SHY-0.04 },
    right_elbow:   { x: CXX+0.10, y: SHY-0.06 },
    right_wrist:   { x: CXX+0.14, y: SHY-0.18 },
    left_knee:     { x: CXX-0.12, y: HIPY+0.16 },
  }),

  leanRight: () => basePose({
    nose:          { x: CXX+0.06, y: 0.29 },
    left_shoulder: { x: CXX-0.05, y: SHY-0.01 },
    right_shoulder:{ x: CXX+0.13, y: SHY+0.01 },
    right_elbow:   { x: CXX+0.20, y: SHY+0.02 },
    right_wrist:   { x: CXX+0.28, y: SHY-0.04 },
    left_elbow:    { x: CXX-0.10, y: SHY-0.06 },
    left_wrist:    { x: CXX-0.14, y: SHY-0.18 },
    right_knee:    { x: CXX+0.12, y: HIPY+0.16 },
  }),

  clapCenter: () => basePose({
    left_elbow:  { x: CXX-0.10, y: SHY+0.04 },
    right_elbow: { x: CXX+0.10, y: SHY+0.04 },
    left_wrist:  { x: CXX-0.02, y: SHY+0.02 },
    right_wrist: { x: CXX+0.02, y: SHY+0.02 },
  }),

  oneKneeUp: () => basePose({
    right_knee:  { x: CXX+0.06, y: HIPY+0.06 },
    right_ankle: { x: CXX+0.08, y: HIPY+0.20 },
    left_elbow:  { x: CXX-0.15, y: SHY-0.06 },
    left_wrist:  { x: CXX-0.14, y: SHY-0.20 },
  }),
};
const M = {
  // ---- upper body ----
  vibrate:(t,a=0.016,s=24)=>{const v=Math.sin(t*s)*a;return{left_shoulder:{x:CXX-0.09+v,y:SHY},right_shoulder:{x:CXX+0.09-v,y:SHY},left_elbow:{x:CXX-0.15+v,y:SHY+0.10},right_elbow:{x:CXX+0.15-v,y:SHY+0.10},left_wrist:{x:CXX-0.17+v,y:SHY+0.20},right_wrist:{x:CXX+0.17-v,y:SHY+0.20}};},
  headCircle:(t,r=0.05)=>{const cx=Math.cos(t*4)*r,cy=Math.sin(t*4)*r*0.8;return{nose:{x:CXX+cx,y:0.28+cy}};},
  headShake:(t)=>{const hx=Math.sin(t*10)*0.05;return{nose:{x:CXX+hx,y:0.28}};},
  headNod:(t)=>{const h=Math.sin(t*4.5)*0.06;return{nose:{x:CXX,y:0.28-Math.abs(h)*0.5}};},
  torsoArch:(t)=>{const a=Math.sin(t*3);return{nose:{x:CXX,y:0.28+a*0.08},left_shoulder:{x:CXX-0.09,y:SHY+a*0.06},right_shoulder:{x:CXX+0.09,y:SHY+a*0.06},left_elbow:{x:CXX-0.16,y:SHY+0.10+a*0.06},right_elbow:{x:CXX+0.16,y:SHY+0.10+a*0.06}};},
  shift:(t,a=0.07,s=1.8)=>({__shift:Math.sin(t*s)*a}),
  twist:(t)=>{const tw=Math.sin(t*4)*0.07;return{left_shoulder:{x:CXX-0.09-tw,y:SHY},right_shoulder:{x:CXX+0.09-tw,y:SHY},left_hip:{x:CXX-0.08+tw,y:HIPY},right_hip:{x:CXX+0.08+tw,y:HIPY}};},
  armsUp:(t)=>{const b=Math.sin(t*2.5)*0.04;return{left_wrist:{x:CXX-0.12,y:SHY-0.22-b},right_wrist:{x:CXX+0.12,y:SHY-0.22-b},left_elbow:{x:CXX-0.13,y:SHY-0.06},right_elbow:{x:CXX+0.13,y:SHY-0.06}};},
  armsOpen:(t)=>{const b=Math.sin(t*2)*0.04;return{nose:{x:CXX,y:0.26-b},left_wrist:{x:CXX-0.28,y:SHY-0.06-b},right_wrist:{x:CXX+0.28,y:SHY-0.06-b},left_elbow:{x:CXX-0.17,y:SHY-0.02},right_elbow:{x:CXX+0.17,y:SHY-0.02}};},
  armCircles:(t)=>({left_wrist:{x:CXX-0.15+Math.cos(t*4.5)*0.08,y:SHY+0.05+Math.sin(t*4.5)*0.13},right_wrist:{x:CXX+0.15+Math.cos(t*4.5+Math.PI)*0.08,y:SHY+0.05+Math.sin(t*4.5+Math.PI)*0.13}}),
  clap:(t,s=7)=>{const c=Math.abs(Math.sin(t*s))*0.14;return{left_wrist:{x:CXX-0.02-c,y:SHY+0.04},right_wrist:{x:CXX+0.02+c,y:SHY+0.04},left_elbow:{x:CXX-0.10-c*0.5,y:SHY+0.06},right_elbow:{x:CXX+0.10+c*0.5,y:SHY+0.06}};},
  pullChest:(t)=>{const p=(Math.sin(t*3.5)*0.5+0.5);return{left_wrist:{x:CXX-0.03,y:SHY+0.08},right_wrist:{x:CXX+0.03,y:SHY+0.08},left_elbow:{x:CXX-0.10-p*0.08,y:SHY+0.08},right_elbow:{x:CXX+0.10+p*0.08,y:SHY+0.08}};},
  wave:(t)=>{const w=Math.sin(t*4)*0.06;return{left_wrist:{x:CXX-0.20,y:SHY+Math.sin(t*5)*0.11},right_wrist:{x:CXX+0.20,y:SHY+Math.sin(t*5+1)*0.11},nose:{x:CXX+w,y:0.28}};},
  reach:(t)=>{const p=(Math.sin(t*3)*0.5+0.5);return{left_wrist:{x:CXX-0.13,y:SHY-p*0.24},right_wrist:{x:CXX+0.13,y:SHY-p*0.24},left_elbow:{x:CXX-0.13,y:SHY-p*0.09},right_elbow:{x:CXX+0.13,y:SHY-p*0.09},left_knee:{x:CXX-0.09,y:HIPY+0.14-p*0.04},right_knee:{x:CXX+0.09,y:HIPY+0.14-p*0.04}};},
  oneArmUp:(t)=>{const s=Math.sin(t*3.5)*0.05;return{right_wrist:{x:CXX+0.12,y:SHY-0.24+s},right_elbow:{x:CXX+0.14,y:SHY-0.06},left_wrist:{x:CXX-0.16,y:SHY+0.22},left_elbow:{x:CXX-0.15,y:SHY+0.10}};},
  overhead:(t)=>{const s=Math.sin(t*5)*0.12;return{left_wrist:{x:CXX-0.06+s,y:SHY-0.26},right_wrist:{x:CXX+0.06+s,y:SHY-0.26},left_elbow:{x:CXX-0.12,y:SHY-0.10},right_elbow:{x:CXX+0.12,y:SHY-0.10}};},
  still:(t)=>({nose:{x:CXX,y:0.28+Math.sin(t*1.2)*0.006}}),
  sway:(t,a=0.07)=>({__shift:Math.sin(t*2.2)*a}),
  // revolve: turn the whole body to face left, then right, continuously
  revolve:(t,s=1.0)=>({__revolve:Math.sin(t*s)}),
  // revolve while doing something with the arms open
  revolveOpen:(t,s=1.0)=>({__revolve:Math.sin(t*s),left_wrist:{x:CXX-0.26,y:SHY-0.02},right_wrist:{x:CXX+0.26,y:SHY-0.02},left_elbow:{x:CXX-0.16,y:SHY},right_elbow:{x:CXX+0.16,y:SHY}}),

let lastRevolveCapture = 0;
function poseFrom(res){
  const shift = res.__shift || 0;
  const lift = res.__lift || 0;
  const revolve = res.__revolve || 0; // -1 faces left, +1 faces right, 0 front
  lastRevolveCapture = revolve;
  const over = {};
  for(const k in res){ if(k==='__shift'||k==='__lift'||k==='__revolve') continue; over[k]=res[k]; }
  const p = basePose(over);
  if(shift || lift){ for(const k in p){ p[k]={x:p[k].x+shift,y:p[k].y-lift}; } }
  if(revolve){
    // Simulate a body turning in place: horizontally squash toward center
    // (like foreshortening), and slide the whole figure slightly in the
    // turn direction so it reads as revolving, not just shrinking.
    const squash = 1 - 0.72 * Math.abs(revolve); // width factor at full turn
    const slide = 0.05 * revolve;                // small drift in turn direction
    for(const k in p){
      p[k] = { x: CXX + (p[k].x - CXX) * squash + slide, y: p[k].y };
    }
  }
  return p;
}
function lerpPose(a, b, tt) {
  const out = {};
  for (const k of GUIDE_JOINTS) {
    const ja = a[k], jb = b[k];
    if (ja && jb) {
      out[k] = { x: ja.x + (jb.x - ja.x) * tt, y: ja.y + (jb.y - ja.y) * tt };
    } else if (jb) {
      out[k] = { x: jb.x, y: jb.y };
    } else if (ja) {
      out[k] = { x: ja.x, y: ja.y };
    }
  }
  return out;
}

function seq(names, step = 1.7) {
  const TRAVEL_D = 1.4;                                    // dance-sec of smooth motion
  const HOLD_D = 3.5 * Math.min(1.25, Math.max(0.85, step / 1.7)); // dance-sec of pause
  const INTERVAL = TRAVEL_D + HOLD_D;
  return (t) => {
    const n = names.length;
    const ph = (t / INTERVAL) % n;
    const i = Math.floor(ph);
    const f = (ph - i) * INTERVAL;
    const a = KFULL[names[i]], b = KFULL[names[(i + 1) % n]];
    // hold first, then travel at the end of the interval into the next pose
    let m = f < HOLD_D ? 0 : (f - HOLD_D) / TRAVEL_D;
    m = m < 0.5 ? 2*m*m : 1 - Math.pow(-2*m + 2, 2) / 2;
    return lerpPose(a, b, m);
  };
}

/* ============================================================
   PART 2 — 2D → 3D bridge.
   Maps the 2D engine's joints onto a 3D skeleton, adds depth,
   and turns spin/revolve into real 3D rotation.
   ============================================================ */

// 2D joints are normalized: x 0..1 (0.5 center), y 0..1 (0 top).
// Map to 3D meters: center x at 0, invert y so up is +, scale.
const SCALE_X = 3.2, SCALE_Y = 3.4, Y_OFF = 2.05;
function to3D(j, z) {
  return [ (j.x - 0.5) * SCALE_X, Y_OFF - j.y * SCALE_Y, z||0 ];
}
// Build a 3D joint set from a 2D pose, INFERRING depth (z) so the figure
// occupies real 3D space instead of a flat plane.
// Heuristics: raised/extended hands come forward; wide arms stay out; the
// torso leans in z with arches; knees lift forward. Depth is subtle so it
// reads natural, not exaggerated.
let dtGlobal = 0;
function pose2Dto3D(p) {
  const P = {};
  const g = (k, z) => to3D(p[k], z);
  const mid = (a,b) => [ (a[0]+b[0])/2, (a[1]+b[1])/2, (a[2]+b[2])/2 ];

  const ls=p.left_shoulder, rs=p.right_shoulder, lh=p.left_hip, rh=p.right_hip;
  const shY = (ls.y+rs.y)/2, hipY=(lh.y+rh.y)/2;

  // --- infer depth per joint ---
  // hands: the higher/more-extended a wrist, the more it reaches FORWARD (+z)
  const wristZ = (w, sh) => {
    if(!w) return 0;
    const lift = Math.max(0, shY - w.y);        // how far above shoulder
    const reach = Math.abs(w.x - sh.x);          // horizontal extension
    return lift*1.4 - reach*0.5;                 // up→forward, wide→flat/back
  };
  const lwZ = wristZ(p.left_wrist, ls), rwZ = wristZ(p.right_wrist, rs);
  const leZ = lwZ*0.5, reZ = rwZ*0.5;            // elbows follow half

  // torso lean: if head is behind hips (arch back) push chest/head -z, else +z
  const headLean = (p.nose ? (p.nose.x - (lh.x+rh.x)/2) : 0);
  const chestZ = 0;
  // knees lift slightly forward
  const kneeZ = (k, hip) => k ? Math.max(0, (hip.y - k.y) - 0.16) * 1.2 : 0;
  const lkZ = kneeZ(p.left_knee, lh), rkZ = kneeZ(p.right_knee, rh);

  const lsv=g('left_shoulder',0), rsv=g('right_shoulder',0), lhv=g('left_hip',0), rhv=g('right_hip',0);
  // widen shoulders AND arm joints outward so the figure looks broad-shouldered
  // like the green tracker (not thin), while hips stay as they are.
  const cxw = (lsv[0]+rsv[0])/2;
  const widenX = (v, f) => cxw + (v-cxw)*f;
  lsv[0] = widenX(lsv[0], 2.4);
  rsv[0] = widenX(rsv[0], 2.4);
  P.neck = mid(lsv,rsv);
  P.hip = mid(lhv,rhv);
  // Head sits a FIXED short distance above the neck (not at the raw nose),
  // so the neck length is always natural — no stretched giraffe neck.
  const torsoLen = Math.abs(P.neck[1] - P.hip[1]) || 0.5;
  P.head = [ P.neck[0], P.neck[1] + torsoLen*0.42, 0.05 ];
  P.chest = [ P.neck[0], (P.neck[1]+P.hip[1])/2, chestZ ];
  P.lShoulder=lsv; P.rShoulder=rsv;
  const le=g('left_elbow', leZ), re=g('right_elbow', reZ);
  le[0]=widenX(le[0],1.6); re[0]=widenX(re[0],1.6);
  P.lElbow=le; P.rElbow=re;
  P.lHand=g('left_wrist', lwZ); P.rHand=g('right_wrist', rwZ);
  P.lHipJ=lhv; P.rHipJ=rhv;
  P.lKnee=g('left_knee', lkZ); P.rKnee=g('right_knee', rkZ);
  P.lFoot=g('left_ankle', lkZ*0.4); P.rFoot=g('right_ankle', rkZ*0.4);
  return P;
}

/* ============================================================
   PART 3 — Lightweight 2D figure (canvas) — replaces Three.js
   Keeps the same API (apply3D, updateFigurePlacement, figurePos,
   figureHeightScale) so the rest of the app is unchanged. Much lighter
   on the CPU/GPU than the 3D engine, so it won't freeze the laptop.
   ============================================================ */
const three = document.getElementById('three');
// a 2D canvas for the yellow figure, over the camera
const figCanvas = document.createElement('canvas');
figCanvas.style.position='absolute'; figCanvas.style.inset='0';
figCanvas.style.width='100%'; figCanvas.style.height='100%';
three.appendChild(figCanvas);
const fx2d = figCanvas.getContext('2d');
function sizeFig(){ figCanvas.width=window.innerWidth; figCanvas.height=window.innerHeight; }
sizeFig();

let figurePos = 'center';   // 'left' | 'center' | 'right'
const POS_X = { left: 0.22, center: 0.5, right: 0.78 }; // fraction of screen width
let figureHeightScale = 1;
function updateFigurePlacement(){ /* applied at draw time */ }

const BONES = [['head','neck'],['neck','chest'],['chest','hip'],['neck','lShoulder'],['neck','rShoulder'],
  ['lShoulder','lElbow'],['lElbow','lHand'],['rShoulder','rElbow'],['rElbow','rHand'],
  ['hip','lHipJ'],['hip','rHipJ'],['lHipJ','lKnee'],['lKnee','lFoot'],['rHipJ','rKnee'],['rKnee','rFoot']];

// Smoothed joint positions for natural, weighted motion.
const smoothF = {};
const SMOOTHF = 0.35;
// pose comes in as {joint:[x,y,z]} (3D coords from pose2Dto3D). We use x,y
// only and map to screen. z is ignored (2D), which is what we want now.
function apply3D(pose, instant){
  // smooth (defensive: only handle array joints [x,y,z])
  for(const n in pose){
    const tgt = pose[n];
    if(!Array.isArray(tgt)) continue;
    if(instant || !smoothF[n]){ smoothF[n] = tgt.slice(); }
    else {
      smoothF[n][0]+=(tgt[0]-smoothF[n][0])*SMOOTHF;
      smoothF[n][1]+=(tgt[1]-smoothF[n][1])*SMOOTHF;
    }
  }
  drawFigure2D(smoothF);
}
// world coords: x roughly -3..3, y roughly 0..2 (from the bridge). Map to screen.
function drawFigure2D(P){
  const W=figCanvas.width, H=figCanvas.height;
  fx2d.clearRect(0,0,W,H);
  // Fit the FULL figure within the frame with top/bottom margins.
  // Figure spans ~1.9 world units tall; clamp its on-screen height so head
  // and feet always stay inside the screen.
  const hs = Math.max(0.5, Math.min(1.0, figureHeightScale)); // clamp so it never overflows
  const baseH = H*0.5*hs;                         // smaller so full body fits with margin
  const unit = baseH/2.05;                        // px per world unit
  const cx = POS_X[figurePos]*W;
  const groundY = H*0.66;                          // feet well above the bottom edge
  const sx = (wx)=> cx + wx*unit*0.55;
  const sy = (wy)=> groundY - wy*unit;
  const p = (n)=> P[n] ? {x:sx(P[n][0]), y:sy(P[n][1])} : null;

  fx2d.save();
  fx2d.lineCap='round'; fx2d.lineJoin='round';
  fx2d.strokeStyle='#f5c518'; fx2d.fillStyle='#f5c518';
  const limbW = Math.max(4, unit*0.06);
  fx2d.lineWidth = limbW;
  fx2d.shadowColor='rgba(0,0,0,0.5)'; fx2d.shadowBlur=6;
  for(const [a,b] of BONES){ const A=p(a),B=p(b); if(!A||!B) continue;
    fx2d.beginPath(); fx2d.moveTo(A.x,A.y); fx2d.lineTo(B.x,B.y); fx2d.stroke(); }
  for(const n in P){ const q=p(n); if(!q) continue;
    const r = n==='head' ? unit*0.11 : limbW*0.5;
    fx2d.beginPath(); fx2d.arc(q.x,q.y,r,0,Math.PI*2); fx2d.fill(); }
  // "AI Teacher" label above the figure's head
  const head = p('head');
  if(head){
    fx2d.shadowColor='rgba(0,0,0,0.7)'; fx2d.shadowBlur=8;
    fx2d.fillStyle='#f5c518';
    fx2d.font='700 '+Math.max(16,unit*0.14)+'px -apple-system, "Segoe UI", sans-serif';
    fx2d.textAlign='center';
    fx2d.fillText('AI', head.x, head.y - unit*0.22);
  }
  fx2d.restore();
}

/* ============================================================
   PART 4 — Systems: session, shuffle, timing, music, tracking
   ============================================================ */
const SESSION_LENGTH = 85;
const MOVE_TIME = 6.0;
let sessionActive=false, sessionStart=0, running=false;
let move0=null, danceClock=0;
let speedFactor=1.0;
const MOTION_BASE=1.25;

const REGION_ORDER = ['India', 'Iran', 'Turkey', 'China', 'Africa', 'Russia', 'Brazil', 'NewZealand', 'Spain', 'Ireland', 'Georgia'];
function moveRegion(dance) {
  if (/Bandari|Zār|Zar|Rezif|Sword dance|Choub|Handkerchief dance · Iran|Rowing dance|Persian|Lur/.test(dance)) return 'Iran';
  if (/Zeybek|Sema|Mevlevi|Azerbaijani|Türkiye|Turkish|Halay|Horon|Kaşık|Kochari|Lezginka|Caucasus|Anatolia|Black Sea|Attan|Afghan|Pashtun/.test(dance)) return 'Turkey';
  if (/China|Chinese|Yayue|Nuo|Dragon|Lion|Waist drum|Flower Drum|Court dance|Hu Xuan|Peacock|Dai people|Bonfire|Tea-picking|Errenzhuan|Loess/.test(dance)) return 'China';

let idxByRegion=null;

  // moves in sequence, then move to the next country. Countries chosen and
  // ordered randomly each session, so every dance is a different tour.
  const MOVES_PER_SESSION = Math.ceil(SESSION_LENGTH / MOVE_TIME); // ~17
  const perCountry = 3; // moves shown per country before switching
  const regions = shuffleArr(REGION_ORDER.filter(r => (idxByRegion[r]||[]).length>0));

  let ri = 0;
  while(order.length < MOVES_PER_SESSION && regions.length){
    const r = regions[ri % regions.length];
    // take up to `perCountry` moves from this country in a row
    let taken = 0;
    while(taken < perCountry && pools[r].length && order.length < MOVES_PER_SESSION){

    if(ri > regions.length*3 && order.length===0) break;

let voiceLang='de'; // 'en' or 'de' — German default
let musicDuck=1;    // multiplier applied to music volume (lowered while speaking)
function speak(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = voiceLang==='de' ? 'de-DE' : 'en-US';

let beatEnergy=0, musicPresence=0, beatGapAvg=0.5, lastBeatAt=0, bassAvg=0, musicalPhase=0, beatPulse=0;
async function startMic(){ try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  micCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=micCtx.createMediaStreamSource(micStream);
  micAnalyser=micCtx.createAnalyser(); micAnalyser.fftSize=1024; micAnalyser.smoothingTimeConstant=0.7;
  src.connect(micAnalyser); micData=new Uint8Array(micAnalyser.frequencyBinCount); micActive=true;
  const loop=()=>{ if(!micActive)return; micAnalyser.getByteFrequencyData(micData);
    const binHz=micCtx.sampleRate/micAnalyser.fftSize, bin=hz=>Math.max(1,Math.min(micData.length-1,Math.round(hz/binHz)));
    let bass=0,nb=0; for(let i=bin(40);i<=bin(180);i++){bass+=micData[i];nb++;} bass/= (nb*255);
    let sp=0,ns=0; for(let i=bin(300);i<=bin(3400);i++){sp+=micData[i];ns++;} sp/=(ns*255);
    let hi=0,nh=0; for(let i=bin(5000);i<=bin(12000);i++){hi+=micData[i];nh++;} hi/=(nh*255);
    const ms=Math.max(0,(bass+hi)-sp*0.9); musicPresence+=(Math.min(1,ms*2.2)-musicPresence)*0.08;
    const ml=(bass*1.3+hi*0.7)*(0.4+0.6*musicPresence); beatEnergy+=(Math.min(1,ml*2.6)-beatEnergy)*0.15;
    const now=performance.now()/1000; bassAvg+=(bass-bassAvg)*0.12;
    if(bass>bassAvg*1.18+0.015 && (now-lastBeatAt)>0.18 && musicPresence>0.15){
      if(lastBeatAt>0){const gap=now-lastBeatAt; if(gap>0.22&&gap<1.6) beatGapAvg+=(gap-beatGapAvg)*0.2;} lastBeatAt=now; beatPulse=1; }
    beatPulse*=0.86; micRaf=requestAnimationFrame(loop); };
  loop();
}catch(e){ micActive=false; } }
function stopMic(){ micActive=false; if(micRaf)cancelAnimationFrame(micRaf); if(micStream)micStream.getTracks().forEach(t=>t.stop()); if(micCtx)micCtx.close(); }

function moveEnergy(mv){ const s=(mv.name+' '+mv.text).toLowerCase();
  if(/jump|kick|stomp|spin|leap|shimmy|split|vibrat|rapid|fast|batter|strike|pop|clap|bounce|whip|explos/.test(s))return 2;
  if(/still|slow|glide|hold|arch|sway|calm|deliberate|float|gentle|controlled|salut|prayer|bow|weight shift/.test(s))return 0;
  return 1; }
function pickForMusic(te){ for(let k=1;k<=moveOrder.length;k++){ const idx=moveOrder[(orderPos+k)%moveOrder.length];
  if(moveEnergy(DANCE_MOVES[idx])===te){ orderPos=(orderPos+k)%moveOrder.length; return idx; } }
  orderPos=(orderPos+1)%moveOrder.length; return moveOrder[orderPos]; }

// advance moves + produce a 3D pose
let lastRevolve=0;
function current3DPose(now){
  if(move0===null) move0=now;
  if(now-move0>=MOVE_TIME){
    if(micActive && musicPresence>0.18){
      const fast=beatGapAvg<0.42, slow=beatGapAvg>0.75;
      let te = (beatEnergy>0.5||fast)?2 : (beatEnergy<0.22||slow)?0 : 1;
      moveIdx=pickForMusic(te);
    } else { orderPos=(orderPos+1)%moveOrder.length; moveIdx=moveOrder[orderPos]; }
    move0=now; showGuideInfo();
  }
  // dance clock: slider always applies; mic modulates
  let dt;
  if(micActive){ musicalPhase += (1/60)*(1.4+beatEnergy*1.6)*speedFactor + beatPulse*0.12*speedFactor; dt=musicalPhase; }
  else { dt = now * MOTION_BASE * speedFactor; }
  const raw = DANCE_MOVES[moveIdx].fn(dt);
  lastRevolve = lastRevolveCapture; // set by poseFrom via global
  // GLOBAL LIVELINESS: visible whole-body motion — hips, LEGS, and arms all
  // move so it reads as a real dancing body. Moderate speed (not too fast).
  const bounce = Math.abs(Math.sin(dt*2.2))*0.045;
  const swayX = Math.sin(dt*1.6)*0.03;
  const armWave = Math.sin(dt*2.0)*0.045;
  const legStep = Math.sin(dt*2.2);           // legs step in rhythm
  for(const k in raw){
    raw[k] = { x: raw[k].x + swayX, y: raw[k].y };
  }
  // hips
  if(raw.left_hip)   raw.left_hip.y   += bounce*0.5;
  if(raw.right_hip)  raw.right_hip.y  += bounce*0.5;
  if(raw.nose)       raw.nose.y       += bounce*0.4;
  // LEGS: alternating knee lift + ankle step so the legs clearly dance
  if(raw.left_knee)  { raw.left_knee.y  += bounce + Math.max(0, legStep)*0.05; raw.left_knee.x  += legStep*0.02; }
  if(raw.right_knee) { raw.right_knee.y += bounce*0.6 + Math.max(0,-legStep)*0.05; raw.right_knee.x += legStep*0.02; }
  if(raw.left_ankle)  { raw.left_ankle.y  += Math.max(0, legStep)*0.06; }
  if(raw.right_ankle) { raw.right_ankle.y += Math.max(0,-legStep)*0.06; }
  // arms
  if(raw.left_wrist)  raw.left_wrist.x  += armWave;
  if(raw.right_wrist) raw.right_wrist.x -= armWave;
  if(raw.left_elbow)  raw.left_elbow.x  += armWave*0.5;
  if(raw.right_elbow) raw.right_elbow.x -= armWave*0.5;

}

// True if the tracked person is close enough to the camera (big enough in

// Draws only the FRONT floor line of the stand zone — a single horizontal

function drawStandZone(w, h){

  const topY = nose ? nose.y : (ls&&rs ? (ls.y+rs.y)/2 : null);
  const hipY = (lh&&rh) ? (lh.y+rh.y)/2 : (lh||rh ? (lh||rh).y : null);
  if(topY!=null && hipY!=null) span = Math.abs(hipY - topY);

const greenSmooth={};
const GK_SMOOTH=0.45;

function drawGreenStick(nk0, w, h, scale, dx, dy, vw, vh){

// Build a 3D pose from the participant's live 2D keypoints (mirror phase).

  P.chest = [ P.neck[0], (P.neck[1]+P.hip[1])/2, 0 ];
  P.lShoulder=ls; P.rShoulder=rs;
  P.lElbow=g('left_elbow')||ls; P.rElbow=g('right_elbow')||rs;
  P.lHand=g('left_wrist')||P.lElbow; P.rHand=g('right_wrist')||P.rElbow;
  P.lHipJ=lh; P.rHipJ=rh;
  P.lKnee=g('left_knee')||lh; P.rKnee=g('right_knee')||rh;
  P.lFoot=g('left_ankle')||P.lKnee; P.rFoot=g('right_ankle')||P.rKnee;
  return P;
}

/* ============================================================
   PART 6 — UI wiring + main loop
   ============================================================ */
const startScreen=document.getElementById('startScreen'), byeScreen=document.getElementById('byeScreen');
const controlsEl=document.getElementById('controls'), statusEl=document.getElementById('status');
const guideText=document.getElementById('guideText'), timerEl=document.getElementById('timer');
const gName=document.getElementById('gName'), gRegion=document.getElementById('gRegion'), gText=document.getElementById('gText');
const dimEl=document.getElementById('dim'), tapHint=document.getElementById('tapHint');

// ---- Air-touch control: raised hand → on-screen pointer → hold to click ----
let airPointer=document.getElementById('airPointer'), airRing=document.getElementById('airRing');
let airX=0, airY=0, airActive=false, activeHand=null, handMiss=0;
let dwellTarget=null, dwellStart=0;
const DWELL_MS=1400; // hold this long over a button to click it
function updateAirControl(){
  // re-fetch if not found yet (pointer element is late in the DOM), then guard
  if(!airPointer) airPointer=document.getElementById('airPointer');
  if(!airRing) airRing=document.getElementById('airRing');
  if(!airPointer) return;
  // find the raised hand: a wrist above its shoulder = intentional pointing
  if(!livePose){ airPointer.classList.add('hidden'); airActive=false; dwellTarget=null; activeHand=null; return; }
  const lw=livePose.left_wrist, rw=livePose.right_wrist;
  let hand=null;
  // STICKY hand with grace: keep the locked hand; only switch if it's been gone
  // for several frames, so a brief tracking dropout doesn't flip hands.
  if(activeHand==='right' && rw){ hand=rw; handMiss=0; }
  else if(activeHand==='left' && lw){ hand=lw; handMiss=0; }
  else if(activeHand){ handMiss++; if(handMiss<10){ return; } activeHand=null; } // hold ~10 frames before releasing
  if(!hand && !activeHand){
    if(rw && lw){ if(rw.y < lw.y){ hand=rw; activeHand='right'; } else { hand=lw; activeHand='left'; } }
    else if(rw){ hand=rw; activeHand='right'; }
    else if(lw){ hand=lw; activeHand='left'; }
    handMiss=0;
  }
  if(!hand){ airPointer.classList.add('hidden'); airActive=false; dwellTarget=null; activeHand=null; if(airRing) airRing.classList.remove('fill'); return; }
  airActive=true;
  // hand.x/y are normalized (mirrored already). Map to screen px, smoothed.
  const tx = hand.x * window.innerWidth, ty = hand.y * window.innerHeight;
  airX += (tx - airX) * 0.35;
  airY += (ty - airY) * 0.35;
  airPointer.classList.remove('hidden');
  airPointer.style.transform = `translate(${airX}px, ${airY}px)`;
  // what's under the pointer? check clickable buttons
  const el = document.elementFromPoint(airX, airY);
  const btn = el && el.closest ? el.closest('button, .ctl, #tapToDance, .consentBtn, .langBtn') : null;
  if(btn && !btn.classList.contains('hidden')){
    // speed buttons repeat quickly on hold (adjust point by point); others click once
    const isSpeed = btn.classList.contains('speedBtn');
    const dwellNeeded = isSpeed ? 500 : DWELL_MS;
    if(dwellTarget!==btn){ dwellTarget=btn; dwellStart=performance.now(); }
    const held = performance.now()-dwellStart;
    const pct = Math.min(100, held/dwellNeeded*100);
    airRing.classList.add('fill'); airRing.style.setProperty('--p', pct+'%');
    if(held>=dwellNeeded){ btn.click();
      if(isSpeed){ dwellStart=performance.now(); } // keep repeating while held
      else { dwellTarget=null; airRing.classList.remove('fill'); dwellStart=performance.now()+600; }
    }
  } else {
    dwellTarget=null; airRing.classList.remove('fill');
  }
}

const handHint=document.getElementById('handHint');
const stepBackHint=document.getElementById('stepBackHint');
const dimCtx=dimEl.getContext('2d');
function sizeDim(){ dimEl.width=window.innerWidth; dimEl.height=window.innerHeight; }
// Draw two soft spotlights from the TOP of the screen — natural, feathered.
// Clean, static soft dim — a gentle vignette that darkens the edges and
// keeps the center (where you and the figure are) brighter. No tracking,
// nothing to break — reliable for the exhibition.
function drawSpotlights(){
  const w=dimEl.width,h=dimEl.height; if(!w) return;
  dimCtx.clearRect(0,0,w,h);
  // soft radial vignette: transparent center → dark edges
  const g = dimCtx.createRadialGradient(w*0.5, h*0.45, Math.min(w,h)*0.15, w*0.5, h*0.5, Math.max(w,h)*0.75);
  g.addColorStop(0,   'rgba(0,0,0,0)');
  g.addColorStop(0.55,'rgba(0,0,0,0.15)');
  g.addColorStop(1,   'rgba(0,0,0,0.6)');
  dimCtx.fillStyle=g;
  dimCtx.fillRect(0,0,w,h);
}
const danceBtn=document.getElementById('tapToDance');
// figure position buttons
const posL=document.getElementById('posL'), posC=document.getElementById('posC'), posR=document.getElementById('posR');
function setPos(p){ figurePos=p; posL.classList.toggle('on',p==='left'); posC.classList.toggle('on',p==='center'); posR.classList.toggle('on',p==='right'); updateFigurePlacement(); }
posL.onclick=()=>setPos('left'); posC.onclick=()=>setPos('center'); posR.onclick=()=>setPos('right');
// estimate participant height from tracking → scale the 3D figure to match
function matchHeight(){
  if(!livePose) return;
  const nose=livePose.nose, la=livePose.left_ankle, ra=livePose.right_ankle;
  const ankle = (la&&ra) ? {y:(la.y+ra.y)/2} : (la||ra);
  // fall back to hip if ankles not visible, so it still tracks near/far
  const lowRef = ankle || (livePose.left_hip && livePose.right_hip ? {y:(livePose.left_hip.y+livePose.right_hip.y)/2 + 0.25} : null);
  if(nose && lowRef){
    const px = Math.abs(lowRef.y - nose.y); // body span, 0..1 of frame → bigger when closer
    const target = px * 3.4 / 1.55;
    // wider range + faster response so moving front/back visibly resizes the figure
    figureHeightScale += (Math.max(0.55, Math.min(1.8, target)) - figureHeightScale) * 0.18;
    updateFigurePlacement();
  }
}
function showGuideInfo(){ const m=DANCE_MOVES[moveIdx]; gName.textContent=m.name; gRegion.textContent=m.dance; gText.textContent=m.text;
  // voice guide: read the instruction in the chosen language
  const line = (voiceLang==='de' && m.de) ? m.de : m.text;
  speak(line);
}

// PHASES: 'idle' (start screen) -> 'mirror' (3D copies you) -> 'teach' (3D teaches)
let phase = 'idle';

document.getElementById('yesBtn').onclick=async()=>{
  try {
    statusEl.style.color='#8f8'; statusEl.textContent='Starting camera…';
    startScreen.classList.add('hidden'); controlsEl.classList.remove('hidden');
    // enter mirror phase UI immediately — wait for a person before Tap to Dance
    phase='mirror';
    setPos('center'); updateFigurePlacement();
    tapHint.classList.add('hidden');
    danceBtn.classList.remove('hidden'); danceBtn.textContent='Tap to Dance';
    if(handHint) handHint.classList.remove('hidden');
    lastSeenAt=0;
    running=true;
    // camera (needs user gesture — this click provides it)
    if(!camReady){
      try{ await setupCam(); }catch(e){ statusEl.style.color='#fc6'; statusEl.textContent='Camera blocked — allow camera & reload'; return; }
    }
    sizeCam();
    // model loads in the BACKGROUND — mirroring starts as soon as it's ready,
    // so the participant isn't left waiting on a loading screen.
    if(!modelReady){ loadModelP().then(()=>{ modelReady=true; statusEl.textContent=''; }).catch(()=>{ statusEl.style.color='#fc6'; statusEl.textContent='Model load failed'; }); }
    else statusEl.textContent='';
  } catch(err){
    statusEl.style.color='#f88'; statusEl.textContent='Start error: ' + (err && err.message || err);
  }
};
document.getElementById('noBtn').onclick=()=>{
  startScreen.classList.add('hidden');
  byeScreen.classList.remove('hidden');
  setTimeout(()=>{ byeScreen.classList.add('hidden'); startScreen.classList.remove('hidden'); }, 2500);
};
// language pick
const langEN=document.getElementById('langEN'), langDE=document.getElementById('langDE');
langEN.onclick=()=>{ voiceLang='en'; langEN.classList.add('on'); langDE.classList.remove('on'); };
langDE.onclick=()=>{ voiceLang='de'; langDE.classList.add('on'); langEN.classList.remove('on'); };

// DANCE button: switch from mirroring to teaching, with spotlight + fresh moves
danceBtn.onclick=()=>{
  if(phase!=='mirror') return;
  phase='teach';
  sizeDim();
  dimEl.classList.add('on');
  tapHint.classList.add('hidden');
  danceBtn.classList.add('hidden');
  if(handHint) handHint.classList.add('hidden');
  guideText.classList.remove('hidden'); timerEl.classList.remove('hidden');
  makeOrder();        // fresh random moves every time Dance is pressed
  showGuideInfo();
  sessionActive=true; sessionStart=performance.now()/1000; move0=null;
  musTrack=(Math.random()*MUS_TRACKS.length)|0; // different music each session
  if(musicOn) startMusic();   // built-in energetic beat
};

const musicBtn=document.getElementById('musicBtn');
musicBtn.onclick=()=>{ musicOn=!musicOn; musicBtn.classList.toggle('on',musicOn);
  musicBtn.textContent = musicOn?'♪ Music':'♪ Muted';
  if(musicOn){ if(phase==='teach') startMusic(); } else { stopMusic(); } };
const speedSlider=document.getElementById('speedSlider'), speedVal=document.getElementById('speedVal');
function setSpeed(v){ speedFactor=Math.max(0.3, Math.min(2.0, Math.round(v*10)/10));
  speedSlider.value=speedFactor; speedVal.textContent=speedFactor.toFixed(1)+'×'; }
speedSlider.oninput=()=>{ setSpeed(parseFloat(speedSlider.value)); };
document.getElementById('speedDown').onclick=()=>{ setSpeed(speedFactor-0.1); }; // slower, point by point
document.getElementById('speedUp').onclick=()=>{ setSpeed(speedFactor+0.1); };   // faster, point by point
document.getElementById('fsBtn').onclick=()=>{ const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
  else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } };
document.getElementById('refreshBtn').onclick=()=>{ location.reload(); };

// Thank-you gesture poses (2D → lifted to 3D). Random each time.
function farewellPose(t, kind){
  if(kind==='bow'){
    // namaskar: hands together at chest, then bend forward
    const bend = Math.min(1, t/1.2);
    return pose2Dto3D(poseFrom({
      left_wrist:{x:CXX-0.02,y:SHY+0.08}, right_wrist:{x:CXX+0.02,y:SHY+0.08},
      left_elbow:{x:CXX-0.10,y:SHY+0.10}, right_elbow:{x:CXX+0.10,y:SHY+0.10},
      nose:{x:CXX, y:0.28 + bend*0.14},
      left_shoulder:{x:CXX-0.09,y:SHY+bend*0.10}, right_shoulder:{x:CXX+0.09,y:SHY+bend*0.10}
    }));
  } else {
    // wave: one arm up, hand swinging side to side
    const sw=Math.sin(t*6)*0.06;
    return pose2Dto3D(poseFrom({
      right_wrist:{x:CXX+0.14+sw,y:SHY-0.22}, right_elbow:{x:CXX+0.15,y:SHY-0.05},
      left_wrist:{x:CXX-0.16,y:SHY+0.20}, left_elbow:{x:CXX-0.15,y:SHY+0.10},
      nose:{x:CXX, y:0.27}
    }));
  }
}
let farewellKind='bow', farewell0=0;
function startFarewell(){
  phase='farewell'; farewell0=performance.now()/1000;
  farewellKind = Math.random()<0.5 ? 'bow' : 'wave';
  stopMusic();
  // figure comes forward (toward viewer) and centers
  setPos('center');
  speak(voiceLang==='de' ? 'Danke fürs Mitmachen!' : 'Thank you for dancing!');
}

function endSession(){ sessionActive=false; stopMic();
  // instead of ending immediately, play the thank-you gesture first
  startFarewell();
  dimEl.classList.remove('on');
}
let goingHome=false;
// Quiet reset — camera empty, no one there: jump straight back to Tap-to-Dance
// with no thank-you screen, near-instant.
function quietReset(){
  if(goingHome) return; goingHome=true;
  byeScreen.classList.add('hidden');
  startScreen.classList.add('hidden');
  dimEl.classList.remove('on');
  guideText.classList.add('hidden');
  timerEl.classList.add('hidden');
  fx2d && fx2d.clearRect(0,0,figCanvas.width,figCanvas.height);
  gctx && gctx.clearRect(0,0,greenCanvas.width,greenCanvas.height);
  sessionActive=false; move0=null; smoothF && Object.keys(smoothF).forEach(k=>delete smoothF[k]);
  phase='mirror'; setPos('center'); updateFigurePlacement();
  controlsEl.classList.remove('hidden');
  if(danceBtn){ danceBtn.classList.remove('hidden'); danceBtn.textContent='Tap to Dance'; }
  running=true;
  setTimeout(()=>{ goingHome=false; }, 300);
}
function goHome(){
  if(goingHome) return; // prevent multiple triggers
  goingHome=true;
  running=false; phase='idle';
  stopMusic(); stopMic();
  byeScreen.classList.remove('hidden');
  setTimeout(()=>{
    byeScreen.classList.add('hidden');
    startScreen.classList.add('hidden'); // skip the consent screen
    dimEl.classList.remove('on');
    guideText.classList.add('hidden');
    timerEl.classList.add('hidden');
    fx2d && fx2d.clearRect(0,0,figCanvas.width,figCanvas.height);
    gctx && gctx.clearRect(0,0,greenCanvas.width,greenCanvas.height);
    sessionActive=false; move0=null; smoothF && Object.keys(smoothF).forEach(k=>delete smoothF[k]);
    // go straight back to the Tap-to-Dance (mirror) screen, camera stays on
    phase='mirror';
    setPos('center'); updateFigurePlacement();
    controlsEl.classList.remove('hidden');
    if(danceBtn){ danceBtn.classList.remove('hidden'); danceBtn.textContent='Tap to Dance'; }
    running=true;
    goingHome=false; // ready for the next cycle
  }, 2800);
}

function onResize(){ sizeCam(); sizeDim(); sizeFig(); }
addEventListener('resize', onResize);

let camFrame=0;
function loop(){ requestAnimationFrame(loop); const now=performance.now()/1000;

  // Home screen: no air control (tap/click Yes with mouse). Air control begins
  // after Yes, in the mirror/teach phases below.

  if(phase==='mirror' || phase==='teach' || phase==='farewell'){
    // camera + tracking every 2nd frame. Green line stays on you.
    if((camFrame++ %3)===0) drawYou(true);
    matchHeight();
    updateAirControl();
    const tracked = livePose && livePose.left_shoulder && livePose.right_shoulder && (livePose.left_hip||livePose.right_hip);

    if(phase==='mirror'){
      // Tap to Dance stays visible the whole time (participant may be up close).
      if(danceBtn) danceBtn.classList.remove('hidden');
      if(handHint) handHint.classList.add('hidden');
      if(tapHint)  tapHint.classList.add('hidden');
    }

    // Person-leaves handling: if the camera goes empty, return to the
    // Tap-to-Dance screen quickly (no thank-you screen — no one is there).
    const grace = (phase==='teach') ? 3 : 1.5;
    if(lastSeenAt>0 && (now - lastSeenAt) > grace){
      sessionActive=false; stopMic(); stopMusic(); dimEl.classList.remove('on');
      quietReset();
    }
  }

  if(phase==='mirror'){
    // figure copies the participant's live pose (responsive, no lag)
    const mp = livePoseTo3D(livePose);
    if(mp) apply3D(mp, true);
  }
  else if(phase==='teach' && sessionActive){
    const remain=SESSION_LENGTH-(now-sessionStart);
    if(remain<=0){ endSession(); }
    else{ timerEl.textContent=Math.ceil(remain)+'s';
      const pose=current3DPose(now);
      apply3D(pose);
      drawSpotlights(); // two soft follow-spotlights
    }
  }
  else if(phase==='farewell'){
    const ft = now - farewell0;
    const fwd = Math.min(1, ft/1.0);
    figurePos = 'center';
    figureHeightScale = figureHeightScale * (1 + fwd*0.008); // slight grow forward
    apply3D(farewellPose(ft, farewellKind), false);
    drawSpotlights();
    if(ft > 3.2){ phase='ending'; goHome(); } // switch phase first so goHome runs once
  }

  // (no 3D renderer needed — figure drawn directly to canvas)
}
loop();

// (auto-refresh removed — the page stays running without resetting)
</script>
